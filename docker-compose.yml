services:

  # Run all tests marked "auto" with 4 parallel workers
  tests-auto:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    command: >
      pytest -m auto --html=reports/report.html --self-contained-html --alluredir=allure-results -v

  # Run all tests marked "validation" with 2 parallel workers
  tests-validation:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    command: >
      pytest -m validation -n 5 --html=reports/report.html --self-contained-html --alluredir=allure-results -v

  # Run API tests (no parallelism needed)
  tests-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./logs:/app/logs
    command: >
      pytest -m api --html=reports/report.html --self-contained-html --alluredir=allure-results -v

  # Playwright-driven Lighthouse audit: logs in, navigates to Create Customer page,
  # runs Lighthouse via the remote-debugging port, saves the HTML report.
  tests-lighthouse:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    command: >
      pytest ui/tests/lighthouse_tests/create_customer_lighthouse.py
      -m lighthouse -v -s
      --html=reports/lighthouse/pytest_lighthouse_report.html
      --self-contained-html
      --alluredir=allure-results
