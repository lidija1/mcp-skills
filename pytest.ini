# ============================================================================
# PYTEST CONFIGURATION FILE
# ============================================================================
# This file configures pytest behavior for the entire project
# Pytest automatically reads this file when running tests

[pytest]
# ----------------------------------------------------------------------------
# Test Discovery Patterns
# ----------------------------------------------------------------------------
# Defines which files and functions pytest should recognize as tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# ----------------------------------------------------------------------------
# BDD feature files location
# ----------------------------------------------------------------------------
# Directory where BDD feature files are stored
bdd_features_base_dir = ui/features/

# ----------------------------------------------------------------------------
# Markers
# ----------------------------------------------------------------------------
# Custom markers for organizing and filtering tests
# Usage: @pytest.mark.smoke or pytest -m smoke
markers =
    auto: tests tagged as Auto
    smoke: Quick smoke tests
    regression: Full regression suite
    login: Login-related tests
    homeowner: Homeowner-related tests
    validation: Validation and error handling tests
    api: API-related tests
    performance: Performance tests
    stress: Stress and load tests

# ----------------------------------------------------------------------------
# Command Line Options (Default)
# ----------------------------------------------------------------------------
# These options are applied every time you run pytest
addopts =
    # Verbose output - shows each test name
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks for easier debugging
    --showlocals
    # Strict markers - fail if unknown marker is used
    --strict-markers
    # Capture method: fd (file descriptor) - captures all output
    --capture=fd
    # Disable warnings summary (comment out to see warnings)
    # --disable-warnings
    # Continue on collection errors
    --continue-on-collection-errors
    # Set default timeout for tests (in seconds)
;    --timeout=300
    # HTML report generation (comment out if not needed)
    --html=reports/pytest_report.html
    --self-contained-html
    # Allure report results generation
    --alluredir=allure-results


# ----------------------------------------------------------------------------
# Playwright Specific Configuration
# ----------------------------------------------------------------------------
# Browser to use: chromium, firefox, webkit, chrome, msedge
# Can be overridden with --browser flag

# Available options:
#    --browser=chromium   (default - Playwright's bundled Chromium)
#    --browser=firefox    (Playwright's bundled Firefox)
#    --browser=webkit     (Playwright's bundled WebKit)
#    --browser=chrome     (system-installed Google Chrome)
#    --browser=msedge     (system-installed Microsoft Edge)

# Default browser (uncomment one):
#    --browser=chromium
    --browser=chrome
#    --browser=msedge
#    --browser=firefox
#    --browser=webkit


# Run in headed mode (show browser window)
# headed = true

# Slow down operations (milliseconds) - useful for debugging
# slow_mo = 500


# Live Logging in console
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
