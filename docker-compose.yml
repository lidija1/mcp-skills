services:

  # Run all tests marked "auto" with 4 parallel workers
  tests-auto:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    command: >
      pytest -m auto --html=reports/report.html --self-contained-html --alluredir=allure-results -v

  # Run all tests marked "validation" with 2 parallel workers
  tests-validation:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    command: >
      pytest -m validation -n 5 --html=reports/report.html --self-contained-html --alluredir=allure-results -v

  # Run API tests (no parallelism needed)
  tests-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./logs:/app/logs
    command: >
      pytest -m api --html=reports/report.html --self-contained-html --alluredir=allure-results -v
